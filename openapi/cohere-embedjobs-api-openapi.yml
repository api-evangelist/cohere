      description: Empty response body
      title: embed-jobs_cancel_Response_200
    List-embed-jobsRequestTooManyRequestsError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: List-embed-jobsRequestTooManyRequestsError
    EmbedJobStatus:
      type: string
      enum:
      - processing
      - complete
      - cancelling
      - cancelled
      - failed
      description: The status of the embed job
      title: EmbedJobStatus
    Get-embed-jobRequestInternalServerError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Get-embed-jobRequestInternalServerError
    Get-embed-jobRequestBadRequestError:
