            application/json:
              schema:
                $ref: '#/components/schemas/Create-embed-jobRequestNotImplementedError'
        '503':
          description: "This error is returned when the service is unavailable. This could be due to:\n  - Too many users trying to access the service at the same time\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-embed-jobRequestServiceUnavailableError'
        '504':
          description: "This error is returned when a request to the server times out. This could be due to:\n  - An internal services taking too long to respond\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-embed-jobRequestGatewayTimeoutError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmbedJobRequest'
      security:
      - bearerAuth: []
    get:
      operationId: embedJobs_list
