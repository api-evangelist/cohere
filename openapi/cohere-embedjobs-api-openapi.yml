  /v1/embed-jobs/{id}/cancel:
    post:
      operationId: embedJobs_cancel
      summary: Cancel an Embed Job
      description: This API allows users to cancel an active embed job. Once invoked, the embedding process will be terminated, and users will be charged for the embeddings processed up to the cancellation point. It's important to note that partial results will not be available to users after cancellation.
      tags:
      - embedJobs
      parameters:
      - name: id
        in: path
        description: The ID of the embed job to cancel.
        required: true
        schema:
          type: string
      - name: X-Client-Name
        in: header
        description: 'The name of the project that is making the request.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/embed-jobs_cancel_Response_200'
        '400':
          description: "This error is returned when the request is not well formed. This could be because:\n  - JSON is invalid\n  - The request is missing required fields\n  - The request contains an invalid combination of fields\n"
