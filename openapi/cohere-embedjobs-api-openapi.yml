          type: string
      title: Create-embed-jobRequestForbiddenError
    Cancel-embed-jobRequestInternalServerError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Cancel-embed-jobRequestInternalServerError
    List-embed-jobsRequestClientClosedRequestError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: List-embed-jobsRequestClientClosedRequestError
    Cancel-embed-jobRequestNotFoundError:
