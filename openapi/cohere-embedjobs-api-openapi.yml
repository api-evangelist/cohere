      properties:
        message:
          type: string
        id:
          type: string
      title: Get-embed-jobRequestClientClosedRequestError
    Get-embed-jobRequestForbiddenError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Get-embed-jobRequestForbiddenError
    EmbeddingType:
      type: string
      enum:
      - float
      - int8
      - uint8
      - binary
      - ubinary
      - base64
      title: EmbeddingType
    Cancel-embed-jobRequestClientClosedRequestError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Cancel-embed-jobRequestClientClosedRequestError
    ListEmbedJobResponse:
      type: object
      properties:
        embed_jobs:
          type: array
          items:
            $ref: '#/components/schemas/EmbedJob'
      title: ListEmbedJobResponse
    Cancel-embed-jobRequestTooManyRequestsError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Cancel-embed-jobRequestTooManyRequestsError
    List-embed-jobsRequestUnprocessableEntityError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: List-embed-jobsRequestUnprocessableEntityError
    Create-embed-jobRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Create-embed-jobRequestUnauthorizedError
    CreateEmbedJobRequestTruncate:
      type: string
      enum:
      - START
      - END
      default: END
      description: 'One of `START|END` to specify how the API will handle inputs longer than the maximum token length.


        Passing `START` will discard the start of the input. `END` will discard the end of the input. In both cases, input is discarded until the remaining input is exactly the maximum input token length for the model.

        '
      title: CreateEmbedJobRequestTruncate
    ApiMetaBilledUnits:
      type: object
      properties:
        images:
          type: number
          format: double
          description: 'The number of billed images.

            '
        input_tokens:
          type: number
          format: double
          description: 'The number of billed input tokens.

            '
        image_tokens:
          type: number
          format: double
          description: 'The number of billed image tokens.

            '
        output_tokens:
          type: number
          format: double
          description: 'The number of billed output tokens.

            '
        search_units:
          type: number
          format: double
          description: 'The number of billed search units.

            '
        classifications:
          type: number
          format: double
          description: 'The number of billed classifications units.

            '
        pages:
          type: number
          format: double
          description: 'The number of billed pages parsed.

            '
      title: ApiMetaBilledUnits
    ApiMetaApiVersion:
      type: object
      properties:
        version:
          type: string
        is_deprecated:
          type: boolean
        is_experimental:
          type: boolean
      required:
      - version
      title: ApiMetaApiVersion
    CreateEmbedJobRequest:
      type: object
      properties:
        model:
          type: string
          format: string
          description: 'ID of the embedding model.


            Available models and corresponding embedding dimensions:


            - `embed-english-v3.0` : 1024

            - `embed-multilingual-v3.0` : 1024

            - `embed-english-light-v3.0` : 384

            - `embed-multilingual-light-v3.0` : 384

            '
        dataset_id:
          type: string
          description: ID of a [Dataset](https://docs.cohere.com/docs/datasets). The Dataset must be of type `embed-input` and must have a validation status `Validated`
        input_type:
          $ref: '#/components/schemas/EmbedInputType'
        name:
          type: string
          description: The name of the embed job.
        embedding_types:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingType'
          description: 'Specifies the types of embeddings you want to get back. Not required and default is None, which returns the Embed Floats response type. Can be one or more of the following types.


            * `"float"`: Use this when you want to get back the default float embeddings. Valid for all models.

            * `"int8"`: Use this when you want to get back signed int8 embeddings. Valid for v3 and newer model versions.

            * `"uint8"`: Use this when you want to get back unsigned int8 embeddings. Valid for v3 and newer model versions.

            * `"binary"`: Use this when you want to get back signed binary embeddings. Valid for v3 and newer model versions.

            * `"ubinary"`: Use this when you want to get back unsigned binary embeddings. Valid for v3 and newer model versions.'
        truncate:
          $ref: '#/components/schemas/CreateEmbedJobRequestTruncate'
          default: END
          description: 'One of `START|END` to specify how the API will handle inputs longer than the maximum token length.


            Passing `START` will discard the start of the input. `END` will discard the end of the input. In both cases, input is discarded until the remaining input is exactly the maximum input token length for the model.

            '
      required:
      - model
      - dataset_id
      - input_type
      title: CreateEmbedJobRequest
    Create-embed-jobRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Create-embed-jobRequestBadRequestError
    CreateEmbedJobResponse:
      type: object
      properties:
        job_id:
          type: string
        meta:
          $ref: '#/components/schemas/ApiMeta'
      required:
      - job_id
      description: Response from creating an embed job.
      title: CreateEmbedJobResponse
    Cancel-embed-jobRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Cancel-embed-jobRequestBadRequestError
    EmbedJob:
      type: object
      properties:
        job_id:
          type: string
          description: ID of the embed job
        name:
          type: string
          description: The name of the embed job
        status:
          $ref: '#/components/schemas/EmbedJobStatus'
          description: The status of the embed job
        created_at:
          type: string
          format: date-time
          description: The creation date of the embed job
        input_dataset_id:
          type: string
          description: ID of the input dataset
        output_dataset_id:
          type: string
          description: ID of the resulting output dataset
        model:
          type: string
          description: ID of the model used to embed
        truncate:
          $ref: '#/components/schemas/EmbedJobTruncate'
          description: The truncation option used
        meta:
          $ref: '#/components/schemas/ApiMeta'
