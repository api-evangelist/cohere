      title: Get-embed-jobRequestGatewayTimeoutError
    Get-embed-jobRequestUnprocessableEntityError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Get-embed-jobRequestUnprocessableEntityError
    Create-embed-jobRequestTooManyRequestsError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Create-embed-jobRequestTooManyRequestsError
    Cancel-embed-jobRequestGatewayTimeoutError:
