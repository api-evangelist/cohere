components:
  schemas:
    Get-dataset-usageRequestClientClosedRequestError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Get-dataset-usageRequestClientClosedRequestError
    List-datasetsRequestForbiddenError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: List-datasetsRequestForbiddenError
    Get-dataset-usageRequestForbiddenError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Get-dataset-usageRequestForbiddenError
    Get-dataset-usageRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Get-dataset-usageRequestUnauthorizedError
    Get-datasetRequestInternalServerError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Get-datasetRequestInternalServerError
    Create-datasetRequestInvalidTokenError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Create-datasetRequestInvalidTokenError
    DatasetType:
      type: string
      enum:
      - embed-input
      - embed-result
      - cluster-result
      - cluster-outliers
      - reranker-finetune-input
      - single-label-classification-finetune-input
      - chat-finetune-input
      - multi-label-classification-finetune-input
      - batch-chat-input
      - batch-openai-chat-input
      - batch-embed-v2-input
      - batch-chat-v2-input
      description: The type of the dataset
      title: DatasetType
    DatasetPart:
      type: object
      properties:
        id:
          type: string
          description: The dataset part ID
        name:
          type: string
          description: The name of the dataset part
        url:
          type: string
          description: The download url of the file
        index:
          type: integer
          description: The index of the file
        size_bytes:
          type: integer
          description: The size of the file in bytes
        num_rows:
          type: integer
          description: The number of rows in the file
        original_url:
          type: string
          description: The download url of the original file
        samples:
          type: array
          items:
            type: string
          description: The first few rows of the parsed file
      required:
      - id
      - name
      title: DatasetPart
    List-datasetsRequestServiceUnavailableError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: List-datasetsRequestServiceUnavailableError
    RerankerDataMetrics:
      type: object
      properties:
        num_train_queries:
          type: integer
          format: int64
          description: The number of training queries.
        num_train_relevant_passages:
          type: integer
          format: int64
          description: The sum of all relevant passages of valid training examples.
        num_train_hard_negatives:
          type: integer
          format: int64
          description: The sum of all hard negatives of valid training examples.
        num_eval_queries:
          type: integer
          format: int64
          description: The number of evaluation queries.
        num_eval_relevant_passages:
          type: integer
          format: int64
          description: The sum of all relevant passages of valid eval examples.
        num_eval_hard_negatives:
          type: integer
          format: int64
          description: The sum of all hard negatives of valid eval examples.
      title: RerankerDataMetrics
    Get-dataset-usageRequestNotImplementedError:
      type: object
      properties:
        message:
          type: string
        id:
          type: string
      title: Get-dataset-usageRequestNotImplementedError
    Get-dataset-usageRequestInternalServerError:
