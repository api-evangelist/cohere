        description: optional filter before a date
        required: false
        schema:
          type: string
          format: date-time
      - name: after
        in: query
        description: optional filter after a date
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: optional limit to number of results
        required: false
        schema:
          type: number
          format: double
      - name: offset
        in: query
        description: optional offset to start of results
        required: false
        schema:
          type: number
          format: double
      - name: validationStatus
        in: query
        description: optional filter by validation status
        required: false
        schema:
          $ref: '#/components/schemas/DatasetValidationStatus'
      - name: X-Client-Name
        in: header
        description: 'The name of the project that is making the request.

          '
        required: false
