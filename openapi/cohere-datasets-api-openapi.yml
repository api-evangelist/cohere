openapi: 3.2.0
info:
  title: Cohere Datasets API
  version: 1.0.0
servers:
- url: https://api.cohere.com
  description: production
tags:
- name: Datasets
paths:
  /v1/datasets:
    post:
      operationId: datasets_create
      summary: Create a Dataset
      description: Create a dataset by uploading a file. See 'Dataset Creation' for more information.
      tags:
      - Datasets
      parameters:
      - name: name
        in: query
        description: The name of the uploaded dataset.
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: The dataset type, which is used to validate the data. The only valid type is `embed-input` used in conjunction with the Embed Jobs API.
        required: true
        schema:
          $ref: '#/components/schemas/DatasetType'
      - name: keep_original_file
        in: query
        description: Indicates if the original file should be stored.
        required: false
        schema:
          type: boolean
      - name: skip_malformed_input
        in: query
        description: Indicates whether rows with malformed input should be dropped (instead of failing the validation check). Dropped rows will be returned in the warnings field.
        required: false
        schema:
          type: boolean
      - name: keep_fields
        in: query
        description: List of names of fields that will be persisted in the Dataset. By default the Dataset will retain only the required fields indicated in the [schema for the corresponding Dataset type](https://docs.cohere.com/docs/datasets#dataset-types). For example, datasets of type `embed-input` will drop all fields other than the required `text` field. If any of the fields in `keep_fields` are missing from the uploaded file, Dataset validation will fail.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: optional_fields
        in: query
        description: List of names of fields that will be persisted in the Dataset. By default the Dataset will retain only the required fields indicated in the [schema for the corresponding Dataset type](https://docs.cohere.com/docs/datasets#dataset-types). For example, Datasets of type `embed-input` will drop all fields other than the required `text` field. If any of the fields in `optional_fields` are missing from the uploaded file, Dataset validation will pass.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: text_separator
        in: query
        description: Raw .txt uploads will be split into entries using the text_separator value.
        required: false
        schema:
          type: string
      - name: csv_delimiter
        in: query
        description: The delimiter used for .csv uploads.
        required: false
        schema:
          type: string
      - name: X-Client-Name
        in: header
        description: 'The name of the project that is making the request.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/datasets_create_Response_200'
        '400':
          description: "This error is returned when the request is not well formed. This could be because:\n  - JSON is invalid\n  - The request is missing required fields\n  - The request contains an invalid combination of fields\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-datasetRequestBadRequestError'
        '401':
          description: "This error indicates that the operation attempted to be performed is not allowed. This could be because:\n  - The api token is invalid\n  - The user does not have the necessary permissions\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-datasetRequestUnauthorizedError'
        '403':
          description: "This error indicates that the operation attempted to be performed is not allowed. This could be because:\n  - The api token is invalid\n  - The user does not have the necessary permissions\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-datasetRequestForbiddenError'
        '404':
          description: "This error is returned when a resource is not found. This could be because:\n  - The endpoint does not exist\n  - The resource does not exist eg model id, dataset id\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-datasetRequestNotFoundError'
        '422':
          description: "This error is returned when the request is not well formed. This could be because:\n  - JSON is invalid\n  - The request is missing required fields\n  - The request contains an invalid combination of fields\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-datasetRequestUnprocessableEntityError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-datasetRequestTooManyRequestsError'
        '498':
          description: 'This error is returned when a request or response contains a deny-listed token.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-datasetRequestInvalidTokenError'
        '499':
          description: 'This error is returned when a request is cancelled by the user.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-datasetRequestClientClosedRequestError'
        '500':
          description: 'This error is returned when an uncategorised internal server error occurs.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-datasetRequestInternalServerError'
        '501':
          description: 'This error is returned when the requested feature is not implemented.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-datasetRequestNotImplementedError'
        '503':
          description: "This error is returned when the service is unavailable. This could be due to:\n  - Too many users trying to access the service at the same time\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-datasetRequestServiceUnavailableError'
        '504':
          description: "This error is returned when a request to the server times out. This could be due to:\n  - An internal services taking too long to respond\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-datasetRequestGatewayTimeoutError'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  format: binary
                  description: The file to upload
                eval_data:
                  type: string
                  format: binary
                  description: An optional evaluation file to upload
              required:
              - data
      security:
      - bearerAuth: []
    get:
      operationId: datasets_list
      summary: List Datasets
      description: List datasets that have been created.
      tags:
      - Datasets
      parameters:
      - name: datasetType
        in: query
        description: optional filter by dataset type
        required: false
        schema:
          type: string
      - name: before
