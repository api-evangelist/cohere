openapi: 3.2.0
info:
  title: Cohere Chat API
  version: '1.0'
  description: 'Operations tagged Chat across 2 of this provider''s published API definitions: cohere-openapi.yml, cohere-chat-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.cohere.com
  description: production
tags:
- name: Chat
paths:
  /v2/chat:
    post:
      operationId: v2_chat_stream
      summary: Chat API (v2)
      description: 'Generates a text response to a user message. To learn how to use the Chat API and RAG follow our Text Generation guides.


        Follow the Migration Guide for instructions on moving from API v1 to API v2.'
      tags:
      - Chat
      parameters:
      - name: X-Client-Name
        in: header
        description: 'The name of the project that is making the request.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'Generates a text response to a user message. To learn how to use the Chat API and RAG follow our [Text Generation guides](https://docs.cohere.com/v2/docs/chat-api).


            Follow the [Migration Guide](https://docs.cohere.com/v2/docs/migrating-v1-to-v2) for instructions on moving from API v1 to API v2.

            '
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/v2_chat_Response_stream_streaming'
        '400':
          description: "This error is returned when the request is not well formed. This could be because:\n  - JSON is invalid\n  - The request is missing required fields\n  - The request contains an invalid combination of fields\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chatv2RequestBadRequestError'
        '401':
          description: "This error indicates that the operation attempted to be performed is not allowed. This could be because:\n  - The api token is invalid\n  - The user does not have the necessary permissions\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chatv2RequestUnauthorizedError'
        '403':
          description: "This error indicates that the operation attempted to be performed is not allowed. This could be because:\n  - The api token is invalid\n  - The user does not have the necessary permissions\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chatv2RequestForbiddenError'
        '404':
          description: "This error is returned when a resource is not found. This could be because:\n  - The endpoint does not exist\n  - The resource does not exist eg model id, dataset id\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chatv2RequestNotFoundError'
        '422':
          description: "This error is returned when the request is not well formed. This could be because:\n  - JSON is invalid\n  - The request is missing required fields\n  - The request contains an invalid combination of fields\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chatv2RequestUnprocessableEntityError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chatv2RequestTooManyRequestsError'
        '498':
          description: 'This error is returned when a request or response contains a deny-listed token.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chatv2RequestInvalidTokenError'
        '499':
          description: 'This error is returned when a request is cancelled by the user.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chatv2RequestClientClosedRequestError'
        '500':
          description: 'This error is returned when an uncategorised internal server error occurs.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chatv2RequestInternalServerError'
        '501':
          description: 'This error is returned when the requested feature is not implemented.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chatv2RequestNotImplementedError'
        '503':
          description: "This error is returned when the service is unavailable. This could be due to:\n  - Too many users trying to access the service at the same time\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chatv2RequestServiceUnavailableError'
        '504':
          description: "This error is returned when a request to the server times out. This could be due to:\n  - An internal services taking too long to respond\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chatv2RequestGatewayTimeoutError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stream:
                  type: boolean
                  enum:
                  - true
                  description: 'Defaults to `false`.


                    When `true`, the response will be a SSE stream of events.


                    Streaming is beneficial for user interfaces that render the contents of the response piece by piece, as it gets generated.

                    '
                model:
                  type: string
                  description: The name of a compatible [Cohere model](https://docs.cohere.com/v2/docs/models).
                messages:
                  $ref: '#/components/schemas/ChatMessages'
                tools:
                  type: array
                  items:
                    $ref: '#/components/schemas/ToolV2'
                  description: 'A list of tools (functions) available to the model. The model response may contain ''tool_calls'' to the specified tools.


                    Learn more in the [Tool Use guide](https://docs.cohere.com/docs/tools).

                    '
                strict_tools:
                  type: boolean
                  description: 'When set to `true`, tool calls in the Assistant message will be forced to follow the tool definition strictly. Learn more in the [Structured Outputs (Tools) guide](https://docs.cohere.com/docs/structured-outputs-json#structured-outputs-tools).


                    **Note**: The first few requests with a new set of tools will take longer to process.

                    '
                documents:
                  type: array
                  items:
                    $ref: '#/components/schemas/V2ChatPostRequestBodyContentApplicationJsonSchemaDocumentsItems'
                  description: 'A list of relevant documents that the model can cite to generate a more accurate reply. Each document is either a string or document object with content and metadata.

                    '
                citation_options:
                  $ref: '#/components/schemas/CitationOptions'
                response_format:
                  $ref: '#/components/schemas/ResponseFormatV2'
                safety_mode:
                  $ref: '#/components/schemas/V2ChatPostRequestBodyContentApplicationJsonSchemaSafetyMode'
                  description: 'Used to select the [safety instruction](https://docs.cohere.com/v2/docs/safety-modes) inserted into the prompt. Defaults to `CONTEXTUAL`.

                    When `OFF` is specified, the safety instruction will be omitted.


                    Safety modes are not yet configurable in combination with `tools` and `documents` parameters.


                    **Note**: This parameter is only compatible newer Cohere models, starting with [Command R 08-2024](https://docs.cohere.com/docs/command-r#august-2024-release) and [Command R+ 08-2024](https://docs.cohere.com/docs/command-r-plus#august-2024-release).


                    **Note**: `command-r7b-12-2024` and newer models only support `"CONTEXTUAL"` and `"STRICT"` modes.

                    '
                max_tokens:
                  type: integer
                  description: 'The maximum number of output tokens the model will generate in the response. If not set, `max_tokens` defaults to the model''s maximum output token limit. You can find the maximum output token limits for each model in the [model documentation](https://docs.cohere.com/docs/models).


                    **Note**: Setting a low value may result in incomplete generations. In such cases, the `finish_reason` field in the response will be set to `"MAX_TOKENS"`.


                    **Note**: If `max_tokens` is set higher than the model''s maximum output token limit, the generation will be capped at that model-specific maximum limit.

                    '
                stop_sequences:
                  type: array
                  items:
                    type: string
                  description: 'A list of up to 5 strings that the model will use to stop generation. If the model generates a string that matches any of the strings in the list, it will stop generating tokens and return the generated text up to that point not including the stop sequence.

                    '
                temperature:
                  type: number
                  format: double
                  description: 'Defaults to `0.3`.


                    A non-negative float that tunes the degree of randomness in generation. Lower temperatures mean less random generations, and higher temperatures mean more random generations.


                    Randomness can be further maximized by increasing the  value of the `p` parameter.

                    '
                seed:
                  type: integer
                  minimum: 0
                  maximum: 18446744073709552000
                  description: 'If specified, the backend will make a best effort to sample tokens

                    deterministically, such that repeated requests with the same

                    seed and parameters should return the same result. However,

                    determinism cannot be totally guaranteed.

                    '
                frequency_penalty:
                  type: number
                  format: double
                  description: 'Defaults to `0.0`, min value of `0.0`, max value of `1.0`.

                    Used to reduce repetitiveness of generated tokens. The higher the value, the stronger a penalty is applied to previously present tokens, proportional to how many times they have already appeared in the prompt or prior generation.

                    '
                presence_penalty:
                  type: number
                  format: double
                  description: 'Defaults to `0.0`, min value of `0.0`, max value of `1.0`.

                    Used to reduce repetitiveness of generated tokens. Similar to `frequency_penalty`, except that this penalty is applied equally to all tokens that have already appeared, regardless of their exact frequencies.

                    '
                k:
                  type: integer
                  minimum: 0
                  maximum: 500
                  default: 0
                  description: 'Ensures that only the top `k` most likely tokens are considered for generation at each step. When `k` is set to `0`, k-sampling is disabled.

                    Defaults to `0`, min value of `0`, max value of `500`.

                    '
                p:
                  type: number
                  format: double
                  default: 0.75
                  description: 'Ensures that only the most likely tokens, with total probability mass of `p`, are considered for generation at each step. If both `k` and `p` are enabled, `p` acts after `k`.

                    Defaults to `0.75`. min value of `0.01`, max value of `0.99`.

                    '
                logprobs:
                  type: boolean
                  description: 'Defaults to `false`. When set to `true`, the log probabilities of the generated tokens will be included in the response.

                    '
                tool_choice:
                  $ref: '#/components/schemas/V2ChatPostRequestBodyContentApplicationJsonSchemaToolChoice'
                  description: 'Used to control whether or not the model will be forced to use a tool when answering. When `REQUIRED` is specified, the model will be forced to use at least one of the user-defined tools, and the `tools` parameter must be passed in the request.

                    When `NONE` is specified, the model will be forced **not** to use one of the specified tools, and give a direct response.

                    If tool_choice isn''t specified, then the model is free to choose whether to use the specified tools or not.


                    **Note**: This parameter is only compatible with models [Command-r7b](https://docs.cohere.com/v2/docs/command-r7b) and newer.

                    '
                thinking:
                  $ref: '#/components/schemas/Thinking'
                priority:
                  type: integer
                  minimum: 0
                  maximum: 999
                  default: 0
                  description: 'Controls how early the request is handled. Lower numbers indicate higher priority (default: 0, the highest). When the system is under load, higher-priority requests are processed first and are the least likely to be dropped.'
              required:
              - stream
              - model
              - messages
      security:
      - bearerAuth: []
    servers:
    - url: https://api.cohere.com
      description: production
  /v1/chat:
    post:
      operationId: chat_stream
      summary: Chat API (v1)
      description: 'Generates a streamed text response to a user message.


        To learn how to use the Chat API and RAG follow our Text Generation guides.'
      parameters:
      - name: X-Client-Name
        in: header
        description: 'The name of the project that is making the request.

          '
        required: false
        schema:
          type: string
      - name: Accepts
        in: header
        description: 'Pass text/event-stream to receive the streamed response as server-sent events. The default is `\n` delimited events.

          '
        required: false
        schema:
          $ref: '#/components/schemas/V1ChatPostParametersAccepts'
      responses:
        '200':
          description: 'Generates a streamed text response to a user message.


            To learn how to use the Chat API and RAG follow our [Text Generation guides](https://docs.cohere.com/docs/chat-api).

            '
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/chat_Response_stream_streaming'
        '400':
          description: "This error is returned when the request is not well formed. This could be because:\n  - JSON is invalid\n  - The request is missing required fields\n  - The request contains an invalid combination of fields\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRequestBadRequestError'
        '401':
          description: "This error indicates that the operation attempted to be performed is not allowed. This could be because:\n  - The api token is invalid\n  - The user does not have the necessary permissions\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRequestUnauthorizedError'
        '403':
          description: "This error indicates that the operation attempted to be performed is not allowed. This could be because:\n  - The api token is invalid\n  - The user does not have the necessary permissions\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRequestForbiddenError'
        '404':
          description: "This error is returned when a resource is not found. This could be because:\n  - The endpoint does not exist\n  - The resource does not exist eg model id, dataset id\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRequestNotFoundError'
        '422':
          description: "This error is returned when the request is not well formed. This could be because:\n  - JSON is invalid\n  - The request is missing required fields\n  - The request contains an invalid combination of fields\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRequestUnprocessableEntityError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRequestTooManyRequestsError'
        '498':
          description: 'This error is returned when a request or response contains a deny-listed token.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRequestInvalidTokenError'
        '499':
          description: 'This error is returned when a request is cancelled by the user.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRequestClientClosedRequestError'
        '500':
          description: 'This error is returned when an uncategorised internal server error occurs.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRequestInternalServerError'
        '501':
          description: 'This error is returned when the requested feature is not implemented.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRequestNotImplementedError'
        '503':
          description: "This error is returned when the service is unavailable. This could be due to:\n  - Too many users trying to access the service at the same time\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRequestServiceUnavailableError'
        '504':
          description: "This error is returned when a request to the server times out. This could be due to:\n  - An internal services taking too long to respond\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRequestGatewayTimeoutError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: 'Text input for the model to respond to.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                model:
                  type: string
                  description: 'The name of a compatible [Cohere model](https://docs.cohere.com/docs/models) or the ID of a [fine-tuned](https://docs.cohere.com/docs/chat-fine-tuning) model.


                    Compatible Deployments: Cohere Platform, Private Deployments

                    '
                stream:
                  type: boolean
                  enum:
                  - true
                  description: 'Defaults to `false`.


                    When `true`, the response will be a JSON stream of events. The final event will contain the complete response, and will have an `event_type` of `"stream-end"`.


                    Streaming is beneficial for user interfaces that render the contents of the response piece by piece, as it gets generated.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                preamble:
                  type: string
                  description: 'When specified, the default Cohere preamble will be replaced with the provided one. Preambles are a part of the prompt used to adjust the model''s overall behavior and conversation style, and use the `SYSTEM` role.


                    The `SYSTEM` role is also used for the contents of the optional `chat_history=` parameter. When used with the `chat_history=` parameter it adds content throughout a conversation. Conversely, when used with the `preamble=` parameter it adds content at the start of the conversation only.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                chat_history:
                  type: array
                  items:
                    $ref: '#/components/schemas/Message'
                  description: 'A list of previous messages between the user and the model, giving the model conversational context for responding to the user''s `message`.


                    Each item represents a single message in the chat history, excluding the current user turn. It has two properties: `role` and `message`. The `role` identifies the sender (`CHATBOT`, `SYSTEM`, or `USER`), while the `message` contains the text content.


                    The chat_history parameter should not be used for `SYSTEM` messages in most cases. Instead, to add a `SYSTEM` role message at the beginning of a conversation, the `preamble` parameter should be used.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                conversation_id:
                  type: string
                  description: 'An alternative to `chat_history`.


                    Providing a `conversation_id` creates or resumes a persisted conversation with the specified ID. The ID can be any non empty string.


                    Compatible Deployments: Cohere Platform

                    '
                prompt_truncation:
                  $ref: '#/components/schemas/V1ChatPostRequestBodyContentApplicationJsonSchemaPromptTruncation'
                  description: "Defaults to `AUTO` when `connectors` are specified and `OFF` in all other cases.\n\nDictates how the prompt will be constructed.\n\nWith `prompt_truncation` set to \"AUTO\", some elements from `chat_history` and `documents` will be dropped in an attempt to construct a prompt that fits within the model's context length limit. During this process the order of the documents and chat history will be changed and ranked by relevance.\n\nWith `prompt_truncation` set to \"AUTO_PRESERVE_ORDER\", some elements from `chat_history` and `documents` will be dropped in an attempt to construct a prompt that fits within the model's context length limit. During this process the order of the documents and chat history will be preserved as they are inputted into the API.\n\nWith `prompt_truncation` set to \"OFF\", no elements will be dropped. If the sum of the inputs exceeds the model's context length limit, a `TooManyTokens` error will be returned.\n\nCompatible Deployments:\n - AUTO: Cohere Platform Only\n - AUTO_PRESERVE_ORDER: Azure, AWS Sagemaker/Bedrock, Private Deployments\n"
                connectors:
                  type: array
                  items:
                    $ref: '#/components/schemas/ChatConnector'
                  description: 'Accepts `{"id": "web-search"}`, and/or the `"id"` for a custom [connector](https://docs.cohere.com/docs/connectors), if you''ve [created](https://docs.cohere.com/v1/docs/creating-and-deploying-a-connector) one.


                    When specified, the model''s reply will be enriched with information found by querying each of the connectors (RAG).


                    Compatible Deployments: Cohere Platform

                    '
                  deprecated: true
                search_queries_only:
                  type: boolean
                  description: 'Defaults to `false`.


                    When `true`, the response will only contain a list of generated search queries, but no search will take place, and no reply from the model to the user''s `message` will be generated.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                  deprecated: true
                documents:
                  type: array
                  items:
                    $ref: '#/components/schemas/ChatDocument'
                  description: "A list of relevant documents that the model can cite to generate a more accurate reply. Each document is a string-string dictionary.\n\nExample:\n```\n[\n  { \"title\": \"Tall penguins\", \"text\": \"Emperor penguins are the tallest.\" },\n  { \"title\": \"Penguin habitats\", \"text\": \"Emperor penguins only live in Antarctica.\" },\n]\n```\n\nKeys and values from each document will be serialized to a string and passed to the model. The resulting generation will include citations that reference some of these documents.\n\nSome suggested keys are \"text\", \"author\", and \"date\". For better generation quality, it is recommended to keep the total word count of the strings in the dictionary to under 300 words.\n\nAn `id` field (string) can be optionally supplied to identify the document in the citations. This field will not be passed to the model.\n\nAn `_excludes` field (array of strings) can be optionally supplied to omit some key-value pairs from being shown to the model. The omitted fields will still show up in the citation object. The \"_excludes\" field will not be passed to the model.\n\nSee ['Document Mode'](https://docs.cohere.com/docs/retrieval-augmented-generation-rag#document-mode) in the guide for more information.\n\nCompatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments\n"
                citation_quality:
                  $ref: '#/components/schemas/V1ChatPostRequestBodyContentApplicationJsonSchemaCitationQuality'
                  description: 'Defaults to `"enabled"`.

                    Citations are enabled by default for models that support it, but can be turned off by setting `"type": "disabled"`.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                temperature:
                  type: number
                  format: double
                  description: 'Defaults to `0.3`.


                    A non-negative float that tunes the degree of randomness in generation. Lower temperatures mean less random generations, and higher temperatures mean more random generations.


                    Randomness can be further maximized by increasing the  value of the `p` parameter.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                max_tokens:
                  type: integer
                  description: 'The maximum number of tokens the model will generate as part of the response. Note: Setting a low value may result in incomplete generations.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                max_input_tokens:
                  type: integer
                  description: 'The maximum number of input tokens to send to the model. If not specified, `max_input_tokens` is the model''s context length limit minus a small buffer.


                    Input will be truncated according to the `prompt_truncation` parameter.


                    Compatible Deployments: Cohere Platform

                    '
                k:
                  type: integer
                  minimum: 0
                  maximum: 500
                  default: 0
                  description: 'Ensures only the top `k` most likely tokens are considered for generation at each step.

                    Defaults to `0`, min value of `0`, max value of `500`.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                p:
                  type: number
                  format: double
                  minimum: 0.01
                  maximum: 0.99
                  default: 0.75
                  description: 'Ensures that only the most likely tokens, with total probability mass of `p`, are considered for generation at each step. If both `k` and `p` are enabled, `p` acts after `k`.

                    Defaults to `0.75`. min value of `0.01`, max value of `0.99`.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                seed:
                  type: integer
                  minimum: 0
                  maximum: 18446744073709552000
                  description: 'If specified, the backend will make a best effort to sample tokens

                    deterministically, such that repeated requests with the same

                    seed and parameters should return the same result. However,

                    determinism cannot be totally guaranteed.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                stop_sequences:
                  type: array
                  items:
                    type: string
                  description: 'A list of up to 5 strings that the model will use to stop generation. If the model generates a string that matches any of the strings in the list, it will stop generating tokens and return the generated text up to that point not including the stop sequence.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                frequency_penalty:
                  type: number
                  format: double
                  description: 'Defaults to `0.0`, min value of `0.0`, max value of `1.0`.


                    Used to reduce repetitiveness of generated tokens. The higher the value, the stronger a penalty is applied to previously present tokens, proportional to how many times they have already appeared in the prompt or prior generation.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                presence_penalty:
                  type: number
                  format: double
                  description: 'Defaults to `0.0`, min value of `0.0`, max value of `1.0`.


                    Used to reduce repetitiveness of generated tokens. Similar to `frequency_penalty`, except that this penalty is applied equally to all tokens that have already appeared, regardless of their exact frequencies.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                raw_prompting:
                  type: boolean
                  description: 'When enabled, the user''s prompt will be sent to the model without

                    any pre-processing.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                tools:
                  type: array
                  items:
                    $ref: '#/components/schemas/Tool'
                  description: 'A list of available tools (functions) that the model may suggest invoking before producing a text response.


                    When `tools` is passed (without `tool_results`), the `text` field in the response will be `""` and the `tool_calls` field in the response will be populated with a list of tool calls that need to be made. If no calls need to be made, the `tool_calls` array will be empty.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
                tool_results:
                  type: array
                  items:
                    $ref: '#/components/schemas/ToolResult'
                  description: "A list of results from invoking tools recommended by the model in the previous chat turn. Results are used to produce a text response and will be referenced in citations. When using `tool_results`, `tools` must be passed as well.\nEach tool_result contains information about how it was invoked, as well as a list of outputs in the form of dictionaries.\n\n**Note**: `outputs` must be a list of objects. If your tool returns a single object (eg `{\"status\": 200}`), make sure to wrap it in a list.\n```\ntool_results = [\n  {\n    \"call\": {\n      \"name\": <tool name>,\n      \"parameters\": {\n        <param name>: <param value>\n      }\n    },\n    \"outputs\": [{\n      <key>: <value>\n    }]\n  },\n  ...\n]\n```\n**Note**: Chat calls with `tool_results` should not be included in the Chat history to avoid duplication of the message text.\n\nCompatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments\n"
                force_single_step:
                  type: boolean
                  description: Forces the chat to be single step. Defaults to `false`.
                response_format:
                  $ref: '#/components/schemas/ResponseFormat'
                safety_mode:
                  $ref: '#/components/schemas/V1ChatPostRequestBodyContentApplicationJsonSchemaSafetyMode'
                  description: 'Used to select the [safety instruction](https://docs.cohere.com/docs/safety-modes) inserted into the prompt. Defaults to `CONTEXTUAL`.

                    When `NONE` is specified, the safety instruction will be omitted.


                    Safety modes are not yet configurable in combination with `tools`, `tool_results` and `documents` parameters.


                    **Note**: This parameter is only compatible newer Cohere models, starting with [Command R 08-2024](https://docs.cohere.com/docs/command-r#august-2024-release) and [Command R+ 08-2024](https://docs.cohere.com/docs/command-r-plus#august-2024-release).


                    **Note**: `command-r7b-12-2024` and newer models only support `"CONTEXTUAL"` and `"STRICT"` modes.


                    Compatible Deployments: Cohere Platform, Azure, AWS Sagemaker/Bedrock, Private Deployments

                    '
              required:
              - message
              - stream
      security:
      - bearerAuth: []
      tags:
      - Chat
    servers:
    - url: https://api.cohere.com
      description: production
  /v2/chat/stream:
    post:
      operationId: chatStream
      summary: Chat with streaming response
      description: Generates a text response to a user message and streams it using server-sent events (SSE). Partial results are delivered as they are generated, enabling real-time display in user interfaces. Emits stream-start, content-delta, citation-start, citation-end, and stream-end events.
      tags:
      - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Streaming chat completion response delivered as SSE events
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '400':
          description: Bad request due to invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized due to missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.cohere.com
      description: Cohere Production Server
