          type: array
          items:
            $ref: '#/components/schemas/V1RerankPostResponsesContentApplicationJsonSchemaResultsItems'
          description: An ordered list of ranked documents
        meta:
          $ref: '#/components/schemas/ApiMeta'
      required:
      - results
      title: rerank_Response_200
    ApiMetaApiVersion:
      type: object
      properties:
        version:
          type: string
        is_deprecated:
          type: boolean
        is_experimental:
          type: boolean
      required:
      - version
      title: ApiMetaApiVersion
    RerankRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
